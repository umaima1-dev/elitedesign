<!-- 2) THE LINK BETWEEN THE BUTTONS AND THE FORM -->
<script>
(function(){
  var ID='popup-H0TFkRA4tFBLG8eZ1Bp1',FORM='H0TFkRA4tFBLG8eZ1Bp1',fb=null,last=null;
  function el(s){return document.getElementById(ID+s)}
  function nativeOpen(){
    var d=el('-div');if(!d)return false;
    document.documentElement.classList.add('clipit-form-open');
    var o=el('-overlay'),h=el('-header');
    if(o&&o.style.display==='none')o.style.display='flex';
    if(h&&h.style.display==='none')h.style.display='flex';
    if(d.style.display==='none')d.style.display='block';
    return true;
  }
  function fallbackOpen(){
    if(!fb){
      fb=document.createElement('div');fb.id='clipit-fallback';
      fb.innerHTML='<div class="cf-box" role="dialog" aria-modal="true" aria-label="Get Clip It free"><div class="cf-head">Get Clip It free<button type="button" class="cf-close" aria-label="Close form">&#10005;</button></div><div class="cf-body"><iframe src="https://api.leadconnectorhq.com/widget/form/'+FORM+'" id="inline-'+FORM+'" data-layout="{\'id\':\'INLINE\'}" data-trigger-type="alwaysShow" data-trigger-value="" data-activation-type="alwaysActivated" data-activation-value="" data-deactivation-type="neverDeactivate" data-deactivation-value="" data-form-name="clip it form" data-height="400" data-layout-iframe-id="inline-'+FORM+'" data-form-id="'+FORM+'" title="clip it form"></iframe></div></div>';
      document.body.appendChild(fb);
      function shut(){fb.className='';document.documentElement.style.overflow='';if(last&&last.focus)last.focus()}
      fb.querySelector('.cf-close').addEventListener('click',shut);
      fb.addEventListener('click',function(e){if(e.target===fb)shut()});
      document.addEventListener('keydown',function(e){if(e.key==='Escape'&&fb.className==='is-open')shut()});
      var s=document.createElement('script');s.src='https://link.msgsndr.com/js/form_embed.js';document.body.appendChild(s);
    }
    fb.className='is-open';document.documentElement.style.overflow='hidden';
  }
  function openForm(e){
    if(e&&e.preventDefault)e.preventDefault();
    last=document.activeElement;
    if(!nativeOpen())fallbackOpen();
  }
  window.clipitOpenForm=openForm;
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('[data-clipit-form],[href$="#get-access"]'):null;
    if(t){e.preventDefault();e.stopPropagation();openForm()}
  },true);
  if(location.hash==='#get-access')window.addEventListener('load',function(){setTimeout(openForm,400)});
})();
</script>
