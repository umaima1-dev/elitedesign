<!-- GHL Custom Code element: Footer -->
<div class="clone-clip-it-footer" style="width:100%;max-width:100%;overflow:hidden;overflow-x:clip;box-sizing:border-box;"><style>
.clone-clip-it-footer{
  --ink:#1C1412; --deep:#120508; --maroon:#7A1F2B; --wine:#4C111A;
  --rust:#D36B48; --btn:#D97757; --peach:#FFB285; --cream:#FDF6EE;
  --white:#FFFFFF; --body:#DED3CC; --mute:#9B8D85;
  --line:rgba(255,255,255,.1); --line-peach:rgba(255,178,133,.4);
  --r-ui:6px; --r-sheet:14px; --r-card:26px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
.clone-clip-it-footer *,.clone-clip-it-footer *::before,.clone-clip-it-footer *::after{box-sizing:border-box}
.clone-clip-it-footer{margin:0;background:var(--ink);color:var(--body);font:400 18px/1.65 "Open Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
.clone-clip-it-footer img{display:block;max-width:100%;height:auto}
.clone-clip-it-footer a{color:inherit}
.clone-clip-it-footer :focus-visible{outline:3px solid var(--peach);outline-offset:3px;border-radius:var(--r-ui)}
.clone-clip-it-footer .wrap{width:min(1240px,100% - 48px);margin-inline:auto}
@media (prefers-reduced-motion:reduce){.clone-clip-it-footer *{animation:none!important;transition-duration:.01ms!important}}
.clone-clip-it-footer footer{border-top:1px solid var(--line);padding:40px 0;color:var(--mute);font:500 .85rem/1.5 Manrope,sans-serif}
.clone-clip-it-footer footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
.clone-clip-it-footer footer img{height:30px;width:auto;opacity:.9}
.clone-clip-it-footer footer a{color:var(--peach);text-underline-offset:3px}
@media (max-width:640px){.clone-clip-it-footer{font-size:17px}
.clone-clip-it-footer .wrap{width:calc(100% - 32px)}}
</style>
<footer>
  <div class="wrap">
    <img src="{{logo.png}}" width="140" height="30" alt="AI Savvy Founders" translate="no" loading="lazy">
    <span>Made by AI Savvy Founders. Questions? <a href="https://instagram.com/aisavvyfounders" rel="noopener">@aisavvyfounders</a></span>
  </div>
</footer>
</div>
