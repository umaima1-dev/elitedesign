<!-- GHL Custom Code element: Final call to action -->
<div class="clone-your-last-episode" style="width:100%;max-width:100%;overflow:hidden;overflow-x:clip;box-sizing:border-box;"><style>
.clone-your-last-episode{
  --ink:#1C1412; --deep:#120508; --maroon:#7A1F2B; --wine:#4C111A;
  --rust:#D36B48; --btn:#D97757; --peach:#FFB285; --cream:#FDF6EE;
  --white:#FFFFFF; --body:#DED3CC; --mute:#9B8D85;
  --line:rgba(255,255,255,.1); --line-peach:rgba(255,178,133,.4);
  --r-ui:6px; --r-sheet:14px; --r-card:26px;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
.clone-your-last-episode *,.clone-your-last-episode *::before,.clone-your-last-episode *::after{box-sizing:border-box}
.clone-your-last-episode{margin:0;background:var(--ink);color:var(--body);font:400 18px/1.65 "Open Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
.clone-your-last-episode a{color:inherit}
.clone-your-last-episode h2{font-family:Inter,system-ui,sans-serif;text-transform:uppercase;color:var(--white);margin:0;text-wrap:balance}
.clone-your-last-episode h2{font-weight:900;font-size:clamp(2rem,4.4vw,3.6rem);line-height:1;letter-spacing:-.025em}
.clone-your-last-episode p{margin:0;text-wrap:pretty}
.clone-your-last-episode .acc{color:var(--rust);font-style:normal}
.clone-your-last-episode :focus-visible{outline:3px solid var(--peach);outline-offset:3px;border-radius:var(--r-ui)}
.clone-your-last-episode .wrap{width:min(1240px,100% - 48px);margin-inline:auto}
.clone-your-last-episode section{position:relative}
.clone-your-last-episode .btn{display:inline-flex;align-items:center;gap:.6em;white-space:nowrap;background:var(--btn);color:var(--ink);
  font:700 1rem/1 Inter,sans-serif;padding:18px 28px;border-radius:var(--r-ui);text-decoration:none;border:0;cursor:pointer;
  transition:transform .25s var(--ease),background-color .25s var(--ease),box-shadow .25s var(--ease)}
.clone-your-last-episode .btn:hover{background:var(--peach);transform:translateY(-2px);box-shadow:0 14px 30px rgba(217,119,87,.28)}
.clone-your-last-episode .btn:active{transform:translateY(0) scale(.98)}
.clone-your-last-episode .btn.lg{font-size:1.15rem;padding:22px 34px}
.clone-your-last-episode .btn .ar{transition:transform .25s var(--ease)}
.clone-your-last-episode .btn:hover .ar{transform:translateX(4px)}
@media (prefers-reduced-motion:reduce){.clone-your-last-episode *{animation:none!important;transition-duration:.01ms!important}}
@media (max-width:640px){.clone-your-last-episode{font-size:17px}
.clone-your-last-episode .wrap{width:calc(100% - 32px)}
.clone-your-last-episode .btn{white-space:normal}}
.clone-your-last-episode p{font-size:inherit;line-height:inherit;font-family:inherit}
.clone-your-last-episode .final{text-align:center;padding:clamp(88px,12vw,170px) 0;background:url("{{site-bg.png}}") 28% 50%/cover,var(--wine);overflow:hidden}
.clone-your-last-episode .final h2{font-size:clamp(2.2rem,6vw,5rem);max-width:15ch;margin-inline:auto}
.clone-your-last-episode .final p{margin:26px auto 0;font-size:clamp(1.1rem,1.7vw,1.4rem);color:var(--white)}
.clone-your-last-episode .final .btn{margin-top:36px}
</style>
<section class="final" aria-labelledby="final">
  <div class="wrap">
    <h2 id="final">Your last episode has <span class="acc">reels</span> in it.</h2>
    <p>You just haven’t had the afternoon to dig them out.<br>Paste the link and let <span translate="no">Clip It</span> dig.</p>
    <a class="btn lg" href="/thanks">Get Clip It free <span class="ar" aria-hidden="true">→</span></a>
  </div>
</section>
</div>
