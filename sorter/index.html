<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Sorter</title>
<style>
:root{--ink:#14090b;--panel:#231115;--line:#3a1f25;--cream:#f6ead8;--muted:#b89a93;--rust:#e0552b;--peach:#f7c9a8;--ok:#7bd88f}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.5 Inter,system-ui,sans-serif;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:32px 16px 80px}
h1{font-weight:900;text-transform:uppercase;font-size:clamp(28px,6vw,52px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--rust)}
p.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:20px}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--rust);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
button:disabled{opacity:.4;cursor:not-allowed}
label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--peach)}
select,input[type=checkbox]{accent-color:var(--rust)}
select{background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px}
.stage{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.source{position:sticky;top:16px;background:var(--cream);color:var(--ink);border-radius:14px;padding:18px;text-align:center}
.source b{display:block;font-size:44px;font-weight:900;line-height:1}
.source small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.pile{font-size:28px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bucket{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;transition:transform .2s,border-color .2s}
.bucket.hit{transform:scale(1.06);border-color:var(--rust)}
.bucket h3{margin:0 0 4px;font-size:15px;font-weight:900}
.bucket .n{font-size:30px;font-weight:900;color:var(--rust);line-height:1}
.bucket .k{font-size:12px;color:var(--muted)}
.bucket .done{position:absolute;top:10px;right:12px;color:var(--ok);font-weight:900;opacity:0}
.bucket.full .done{opacity:1}
.chip{position:fixed;z-index:50;pointer-events:none;width:64px;height:64px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--peach);color:var(--ink);font-size:30px;border:3px solid var(--cream);box-shadow:0 0 0 2px var(--rust),0 14px 34px #000a,0 0 30px #e0552b88}
.chip img,.chip video{width:100%;height:100%;object-fit:cover;display:block}
.spark{position:fixed;z-index:51;pointer-events:none;width:8px;height:8px;border-radius:50%}
.bucket{overflow:hidden;opacity:0;animation:rise .55s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.8) rotate(-4deg)}to{opacity:1;transform:none}}
.bucket .bar2{position:absolute;left:0;bottom:0;height:5px;width:0;background:linear-gradient(90deg,var(--rust),var(--peach));transition:width .3s}
.bucket.full{border-color:var(--ok);box-shadow:0 0 22px #7bd88f55}
.bucket.full .done{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
.source.fire{animation:thump .25s}
@keyframes thump{50%{transform:scale(.93) rotate(-1.5deg)}}
.source{transition:background .4s}
.source.done2{background:var(--ok)}
.confetti{position:fixed;z-index:60;pointer-events:none;width:10px;height:16px;top:-20px}
#log{margin-top:20px;color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:40px;border:1px dashed var(--line);border-radius:14px;text-align:center}
@media(prefers-reduced-motion:reduce){.bucket{transition:none;animation:none;opacity:1}.chip,.spark,.confetti{display:none}}
</style>
</head>
<body>
<main>
 <h1>Content → <em>Day Planner</em></h1>
 <p class="sub">Pick a folder of photos, reels and videos. It spreads them across the upcoming days of this month, one folder per posting day, on your own device. Nothing is uploaded anywhere.</p>

 <div class="bar">
  <button id="pick">1. Choose folder</button>
  <label>From <input type="date" id="d1"></label>
  <label>To <input type="date" id="d2"></label>
  <label>Order
   <select id="ord"><option value="mix">Mix photos &amp; reels</option><option value="name">By file name</option><option value="old">Oldest first</option><option value="rand">Random</option></select></label>
  <label><input type="checkbox" id="wk"> Skip weekends</label>
  <label><input type="checkbox" id="sub" checked> Include subfolders</label>
  <label>Mode
   <select id="mode"><option value="copy">Copy (safe)</option><option value="move">Move</option></select></label>
  <button id="go" disabled>2. Sort now</button>
 </div>

 <div id="stage"><div class="empty">No folder yet. Click “Choose folder”. Works in Chrome or Edge on desktop.</div></div>
 <div id="log"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const OUT='Content-Plan';
const IMG=/\.(jpe?g|png|gif|webp|heic|heif|avif|bmp|tiff?)$/i, VID=/\.(mp4|mov|m4v|avi|mkv|webm|3gp)$/i;
let root=null, items=[];

const icon=k=>k==='image'?'🖼️':k==='video'?'🎬':'📄';
const pad=n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayName=k=>new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
(()=>{const t=new Date(); $('d1').value=iso(t); $('d2').value=iso(new Date(t.getFullYear(),t.getMonth()+1,0));})();

function planDays(){
  const days=[]; const a=new Date($('d1').value+'T00:00'), z=new Date($('d2').value+'T00:00');
  for(let d=new Date(a); d<=z; d.setDate(d.getDate()+1)){
    if($('wk').checked && [0,6].includes(d.getDay())) continue;
    days.push(iso(d));
  }
  return days;
}
function orderItems(list){
  const o=$('ord').value, l=[...list];
  if(o==='rand') return l.sort(()=>Math.random()-.5);
  if(o==='old') return l.sort((x,y)=>x.file.lastModified-y.file.lastModified);
  l.sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
  if(o==='name') return l;
  const q={image:[],video:[],other:[]}; l.forEach(i=>q[i.kind].push(i));
  const out=[]; while(q.image.length||q.video.length||q.other.length)
    for(const k of ['video','image','other']) if(q[k].length) out.push(q[k].shift());
  return out;
}
function plan(){
  const days=planDays();
  if(!days.length||!items.length){ items.forEach(i=>i.key=null); return; }
  const list=orderItems(items), n=list.length, D=days.length;
  list.forEach((it,i)=>{ it.key=days[Math.min(D-1,Math.floor(i*D/n))]; });
}

async function scan(dir,parent,out,deep){
  for await(const [name,h] of dir.entries()){
    if(h.kind==='directory'){
      if(deep && name!==OUT) await scan(h,dir,out,true);
      continue;
    }
    const file=await h.getFile();
    out.push({name,file,parent:dir,kind:IMG.test(name)?'image':VID.test(name)?'video':'other'});
  }
}

function render(){
  plan();
  const groups={}; planDays().forEach(d=>groups[d]=[]);
  items.forEach(it=>it.key&&groups[it.key].push(it));
  const keys=Object.keys(groups);
  $('stage').innerHTML=`<div class="stage">
    <div class="source" id="src"><div class="pile">📂</div><b id="left">${items.length}</b><small>files waiting</small></div>
    <div class="grid">${keys.map(k=>{
      const g=groups[k],c=t=>g.filter(i=>i.kind===t).length;
      return `<div class="bucket" data-k="${k}" style="--i:${keys.indexOf(k)}"><div class="bar2"></div><span class="done">✓</span><h3>${dayName(k)}</h3><div class="k">planned ${g.length}</div>
        <div class="n">0</div>
        <div class="k">🖼️ ${c('image')} · 🎬 ${c('video')} · 📄 ${c('other')}</div></div>`}).join('')}</div></div>`;
  $('go').disabled=!items.length||!keys.length;
}

$('pick').onclick=async()=>{
  if(!window.showDirectoryPicker){ $('log').textContent='This browser cannot write to folders. Please use Chrome or Edge on desktop.'; return; }
  try{ root=await showDirectoryPicker({mode:'readwrite'}); }catch{ return; }
  $('log').textContent='Reading folder…';
  const raw=[]; await scan(root,null,raw,$('sub').checked);
  items=raw;
  $('log').textContent=`Found ${items.length} files in “${root.name}”.`;
  render();
};
['d1','d2','ord','wk'].forEach(id=>$(id).onchange=()=>{ if(items.length) render(); });

const COLORS=['#e0552b','#f7c9a8','#f6ead8','#7bd88f','#ffb703'];
function burst(x,y,n=10){
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='spark';
    el.style.cssText+=`left:${x}px;top:${y}px;background:${COLORS[i%COLORS.length]}`;
    document.body.appendChild(el);
    const ang=Math.PI*2*i/n+Math.random()*.5, r=30+Math.random()*40;
    el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*r}px,${Math.sin(ang)*r}px) scale(0)`,opacity:0}],{duration:520,easing:'ease-out'}).onfinish=()=>el.remove();
  }
}
function confetti(){
  for(let i=0;i<120;i++){
    const el=document.createElement('div'); el.className='confetti';
    el.style.left=Math.random()*100+'vw'; el.style.background=COLORS[i%COLORS.length];
    document.body.appendChild(el);
    el.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*200}px,${innerHeight+40}px) rotate(${Math.random()*900}deg)`,opacity:1}],
      {duration:1800+Math.random()*1600,delay:Math.random()*500,easing:'cubic-bezier(.3,.1,.6,1)',fill:'both'}).onfinish=()=>el.remove();
  }
}
function fly(from,to,it){
  const a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
  const el=document.createElement('div'); el.className='chip';
  let url=null;
  if(it.kind==='image'||it.kind==='video'){
    url=URL.createObjectURL(it.file);
    el.innerHTML=it.kind==='image'?`<img src="${url}">`:`<video src="${url}#t=0.3" muted preload="metadata"></video>`;
  } else el.textContent=icon(it.kind);
  const sx=a.left+a.width/2-32, sy=a.top+a.height/2-32;
  el.style.left=sx+'px'; el.style.top=sy+'px';
  document.body.appendChild(el);
  const tx=b.left+b.width/2, ty=b.top+b.height/2;
  const dx=tx-(sx+32), dy=ty-(sy+32), side=(Math.random()-.5)*260;
  const anim=el.animate([
    {transform:'translate(0,0) scale(.3) rotate(0)',opacity:0,offset:0},
    {transform:`translate(${side*.4}px,-90px) scale(1.25) rotate(${side/8}deg)`,opacity:1,offset:.25},
    {transform:`translate(${dx*.6+side}px,${dy*.5-70}px) scale(1) rotate(${-side/6}deg)`,opacity:1,offset:.6},
    {transform:`translate(${dx}px,${dy}px) scale(.35) rotate(${side/3}deg)`,opacity:.9,offset:1}
  ],{duration:800,easing:'cubic-bezier(.45,.05,.3,1)'});
  anim.onfinish=()=>{ el.remove(); url&&URL.revokeObjectURL(url); burst(tx,ty); };
  return anim.finished;
}

async function uniqueName(dir,name){
  let n=name,i=1;
  const dot=name.lastIndexOf('.'), base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
  while(true){
    try{ await dir.getFileHandle(n); n=`${base}-${i++}${ext}`; }catch{ return n; }
  }
}

async function copyOne(it,dest){
  const name=await uniqueName(dest,it.name);
  const w=await (await dest.getFileHandle(name,{create:true})).createWritable();
  await it.file.stream().pipeTo(w);
  if($('mode').value==='move') await it.parent.removeEntry(it.name);
}

$('go').onclick=async()=>{
  if(!root||!items.length) return;
  $('go').disabled=$('pick').disabled=true;
  const outDir=await root.getDirectoryHandle(OUT,{create:true});
  const dirs={}; let left=items.length, failed=0;
  const total={}; items.forEach(i=>total[i.key]=(total[i.key]||0)+1);
  const got={};
  const pending=[];
  for(const it of items){
    const bucket=document.querySelector(`.bucket[data-k="${it.key}"]`);
    bucket.scrollIntoView({block:'nearest',behavior:'smooth'});
    $('src').classList.remove('fire'); void $('src').offsetWidth; $('src').classList.add('fire');
    const flight=fly($('src'),bucket,it).then(()=>{
      bucket.classList.add('hit'); setTimeout(()=>bucket.classList.remove('hit'),180);
      got[it.key]=(got[it.key]||0)+1;
      bucket.querySelector('.n').textContent=got[it.key];
      bucket.querySelector('.bar2').style.width=(got[it.key]/total[it.key]*100)+'%';
      if(got[it.key]===total[it.key]) bucket.classList.add('full');
    });
    try{
      dirs[it.key]??=await outDir.getDirectoryHandle(it.key,{create:true});
      await copyOne(it,dirs[it.key]);
    }catch(e){ failed++; console.error(it.name,e); }
    $('left').textContent=--left;
    pending.push(flight);
    await sleep(Math.max(60,Math.min(350,2500/items.length)));
  }
  await Promise.all(pending);
  $('src').classList.add('done2'); $('src').querySelector('small').textContent='all planned'; $('src').querySelector('.pile').textContent='🎉'; confetti();
  $('log').textContent=`Done. ${items.length-failed} files planned into “${OUT}” inside “${root.name}”.`+(failed?` ${failed} failed (see console).`:'');
  $('pick').disabled=false;
};
</script>
</body>
</html>
